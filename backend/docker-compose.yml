services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: diabetic_retinopathy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diabetic_retinopathy"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/diabetic_retinopathy
      STORAGE_DIR: /app/storage
      BLOCKCHAIN_DATA_DIR: /app/blockchain_data
      BLOCKCHAIN_ENABLED: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Définir JWT_SECRET_KEY dans backend/.env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      FERNET_KEY: ${FERNET_KEY:?Définir FERNET_KEY dans backend/.env (./scripts/prepare-env.sh)}
      MAX_IMAGE_SIZE_MB: ${MAX_IMAGE_SIZE_MB:-10}
      AI_SERVICE_URL: http://ia:8001
      MOBILE_API_KEY: ${MOBILE_API_KEY:-dev-mobile-api-key-change-me}
      BLOCKCHAIN_POW_DIFFICULTY: ${BLOCKCHAIN_POW_DIFFICULTY:-2}
    volumes:
      - image_storage:/app/storage
      - blockchain_data:/app/blockchain_data
    depends_on:
      db:
        condition: service_healthy
      ia:
        condition: service_started

  ia:
    build:
      context: ../ia
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      RODIUMAI_API_KEY: ${RODIUMAI_API_KEY:-}
      RODIUMAI_BASE_URL: ${RODIUMAI_BASE_URL:-https://api.rodiumai.io/v1}
      RODIUMAI_VISION_MODEL: ${RODIUMAI_VISION_MODEL:-openai/gpt-4o}
      RODIUMAI_AGENT_MODEL: ${RODIUMAI_AGENT_MODEL:-openai/gpt-4o-mini}

volumes:
  pgdata:
  image_storage:
  blockchain_data:
